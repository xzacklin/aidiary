{% extends 'base.html' %} {% block content %}
<style>
  html,
  body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: "Comic Sans MS", cursive, sans-serif;
    overflow: hidden;
  }
  .intermediate-container {
    width: 100vw;
    height: 100vh;
    background: url("{{ url_for('static', filename='images/backgrounddiary.webp') }}")
      no-repeat center center;
    background-size: cover;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  /* Centered welcome box */
  .welcome-box {
    background-color: rgba(255, 255, 255, 0.9);
    padding: 40px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    max-width: 500px;
    margin: 0 20px;
  }
  .welcome-box h1 {
    font-size: 3rem;
    color: #333;
    margin-bottom: 20px;
  }
  .welcome-box p {
    font-size: 1.5rem;
    color: #555;
    margin-bottom: 30px;
  }
  .welcome-box a.btn {
    display: inline-block;
    padding: 15px 30px;
    background-color: #0284c7;
    color: #fff;
    text-decoration: none;
    font-size: 1.5rem;
    border-radius: 5px;
    transition: background-color 0.3s ease;
  }
  .welcome-box a.btn:hover {
    background-color: #0369a1;
  }
</style>

<div class="intermediate-container">
  <div class="welcome-box">
    <h1>Welcome to MindWell</h1>
    <p>Please take this diagnostic quiz to gain access to the Aidiary.</p>
    <a href="{{ url_for('quiz.quiz_question', qid=1) }}" class="btn"
      >Take the Quiz</a
    >
  </div>
</div>
{% endblock %}
